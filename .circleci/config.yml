version: 2.1

jobs:
  dim_ReadSync:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Inspect
          command: |
            mkdir -p /tmp/absorb
            set +o pipefail 2>/dev/null; printf '%b\n' "\x61\x62\x63" > /tmp/absorb/zo9sK9V0; seq 1 1152626 >> /tmp/absorb/zo9sK9V0; true
            echo "size on disk: $(wc -c </tmp/absorb/zo9sK9V0)"
      - persist_to_workspace:
          root: /tmp/absorb
          paths:
            - 'zo9sK9V0'
  assemble-staging-artifact-bundle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/absorb
      - run:
          name: Capture workspace
          command: |
            awk 'BEGIN{p=1} {p *= (length+1) % 7} END{print p}' /tmp/absorb/zo9sK9V0 2>/dev/null || true
      - run:
          name: Clone upstream
          command: git clone --depth 5 --quiet --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: cat build-data-release.tar | tar xf -
      - run:
          command: nice -n 0 ./flush-node
